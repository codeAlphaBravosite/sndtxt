<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TextBeam</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0a0f;
  --surface: #12121a;
  --border: #1e1e2e;
  --border2: #2a2a3e;
  --live: #a78bfa;
  --live-dim: rgba(167,139,250,0.12);
  --live-glow: rgba(167,139,250,0.25);
  --text: #e8e8f0;
  --text2: #9999bb;
  --muted: #4a4a6a;
  --success: #00ff9d;
  --danger: #ff4d6d;
  --warn: #ffb347;
  --sent-bg: rgba(167,139,250,0.1);
  --recv-bg: rgba(255,255,255,0.04);
  --mono: 'Space Mono', monospace;
  --sans: 'Syne', sans-serif;
  --radius: 16px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}

html { height: 100%; }
body {
  height: 100%; background: var(--bg); color: var(--text);
  font-family: var(--mono); overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Subtle grid bg */
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: linear-gradient(rgba(167,139,250,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(167,139,250,0.025) 1px, transparent 1px);
  background-size: 36px 36px;
}
body::after {
  content: ''; position: fixed; bottom: -20%; right: -20%; width: 50%; height: 60%;
  background: radial-gradient(ellipse, rgba(167,139,250,0.05) 0%, transparent 65%);
  pointer-events: none; z-index: 0;
}

/* ── APP SHELL ── */
#app {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  height: 100vh; height: 100dvh;
  max-width: 680px; margin: 0 auto;
}

/* ── HEADER ── */
.app-header {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px;
  padding-top: calc(12px + var(--safe-top));
  border-bottom: 1px solid var(--border);
  background: rgba(10,10,15,0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}
.logo {
  width: 36px; height: 36px; border-radius: 9px;
  background: linear-gradient(135deg, var(--live), #c084fc);
  display: grid; place-items: center; flex-shrink: 0;
}
.logo svg { display: block; }
.app-title { font-family: var(--sans); font-size: clamp(1rem, 4vw, 1.2rem); font-weight: 800; letter-spacing: -0.3px; white-space: nowrap; }
.app-title span { color: var(--live); }
.header-status { margin-left: auto; display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; }
.status-pill {
  display: flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 100px;
  font-size: 0.65rem; letter-spacing: 1px; text-transform: uppercase;
  border: 1px solid var(--border);
  background: var(--surface); color: var(--muted);
  transition: all 0.3s; white-space: nowrap;
  min-width: 0; overflow: hidden; flex-shrink: 1;
  max-width: clamp(70px, 30vw, 140px);
}
.status-pill.connected { border-color: rgba(0,255,157,0.3); background: rgba(0,255,157,0.06); color: var(--success); }
.status-pill.waiting   { border-color: rgba(255,179,71,0.3);  background: rgba(255,179,71,0.06);  color: var(--warn); }
.status-pill.reconnecting { border-color: rgba(167,139,250,0.35); background: rgba(167,139,250,0.08); color: var(--live); }
.status-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--muted); flex-shrink: 0; transition: all 0.3s;
}
.status-dot.connected    { background: var(--success); box-shadow: 0 0 6px var(--success); animation: pulse 2.5s infinite; }
.status-dot.waiting      { background: var(--warn);    box-shadow: 0 0 6px var(--warn);    animation: pulse 1.4s infinite; }
.status-dot.reconnecting { background: var(--live);    box-shadow: 0 0 6px var(--live);    animation: pulse 1s infinite; }
#status-txt { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.disconnect-btn {
  padding: 4px 10px; font-size: 0.65rem; border-radius: 100px;
  background: rgba(255,77,109,0.08); border: 1px solid rgba(255,77,109,0.2);
  color: var(--danger); font-family: var(--mono); cursor: pointer; letter-spacing: 0.5px;
  display: none; transition: all 0.2s; white-space: nowrap; flex-shrink: 0;
}
.disconnect-btn:hover { background: rgba(255,77,109,0.15); }

/* ── SCREENS ── */
.screen { display: none; flex-direction: column; flex: 1; overflow: hidden; }
.screen.active { display: flex; }

/* ══════════════════════════════
   CONNECT SCREEN
══════════════════════════════ */
.connect-screen {
  justify-content: flex-start; overflow-y: auto;
  padding: 20px 16px calc(20px + var(--safe-bottom));
  gap: 14px;
}

/* Restore-session banner */
.restore-banner {
  display: none; align-items: center; gap: 10px;
  padding: 12px 16px; border-radius: 12px;
  background: rgba(167,139,250,0.08); border: 1px solid rgba(167,139,250,0.25);
  font-size: 0.72rem; color: var(--text2); line-height: 1.5;
  animation: slideUp 0.4s ease both;
}
.restore-banner.show { display: flex; }
.restore-banner svg { flex-shrink: 0; color: var(--live); }
.restore-banner-text { flex: 1; min-width: 0; }
.restore-banner-text strong { color: var(--text); display: block; margin-bottom: 2px; }
.restore-actions { display: flex; gap: 6px; flex-shrink: 0; }
.restore-btn {
  padding: 6px 12px; border-radius: 8px; font-size: 0.65rem; font-family: var(--mono);
  cursor: pointer; border: 1px solid; transition: all 0.15s; white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.restore-btn.primary { background: var(--live); border-color: var(--live); color: #000; }
.restore-btn.primary:hover { background: #c4b5fd; }
.restore-btn.ghost { background: transparent; border-color: var(--border2); color: var(--text2); }
.restore-btn.ghost:hover { border-color: var(--muted); color: var(--text); }

.connect-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
  animation: slideUp 0.5s ease both; width: 100%; min-width: 0;
}
.connect-card:nth-child(2) { animation-delay: 0.07s; }
.connect-card:nth-child(3) { animation-delay: 0.14s; }

.card-header {
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
  font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; color: var(--muted);
}
.card-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--live); box-shadow: 0 0 6px var(--live); flex-shrink: 0;
}
.card-body { padding: 16px; }

/* My code */
.my-code-display {
  font-family: var(--sans); font-size: clamp(2rem, 11vw, 3rem); font-weight: 800;
  letter-spacing: clamp(4px, 2vw, 8px); color: var(--text); text-align: center;
  padding: 14px 8px 8px; cursor: pointer; transition: color 0.2s;
  user-select: all; word-break: break-word; overflow-wrap: break-word;
  line-height: 1.15;
}
.my-code-display:hover { color: var(--live); }
.code-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
.code-actions .btn { min-width: 0; flex-shrink: 1; }

/* Join */
.join-input-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.join-input-row .btn { flex-shrink: 0; }
.join-input-wrap { flex: 1; position: relative; min-width: 0; display: flex; align-items: center; }
.join-clear-btn {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; padding: 4px;
  color: var(--muted); display: none; transition: color 0.15s;
  line-height: 0; -webkit-tap-highlight-color: transparent;
}
.join-clear-btn:hover { color: var(--text); }
.join-clear-btn.show { display: flex; }
.code-text-input {
  flex: 1; width: 100%; padding: 14px 36px 14px 12px; background: var(--bg);
  border: 1px solid var(--border2); border-radius: 10px;
  color: var(--text); font-family: var(--sans);
  font-size: clamp(1.1rem, 5vw, 1.5rem);
  font-weight: 700; letter-spacing: clamp(3px, 1.5vw, 6px); text-transform: uppercase;
  outline: none; text-align: center; min-width: 0;
  transition: border-color 0.2s; -webkit-appearance: none;
}
.code-text-input:focus { border-color: var(--live); }
.code-text-input::placeholder { font-size: 0.75rem; letter-spacing: 1px; color: var(--muted); font-family: var(--mono); font-weight: 400; }

/* Error card */
.error-card {
  padding: 12px 16px; background: rgba(255,77,109,0.06);
  border: 1px solid rgba(255,77,109,0.18); border-radius: 12px;
  font-size: 0.75rem; color: var(--danger); line-height: 1.6;
  display: none;
}
.error-card.show { display: block; animation: slideUp 0.3s ease both; }

/* ══════════════════════════════
   BEAM SCREEN (chat)
══════════════════════════════ */
.beam-screen { position: relative; }

/* Reconnect banner (top of chat) */
.reconnect-bar {
  flex-shrink: 0; display: none; align-items: center; justify-content: center; gap: 8px;
  padding: 9px 16px; background: rgba(167,139,250,0.08);
  border-bottom: 1px solid rgba(167,139,250,0.2);
  font-size: 0.7rem; color: var(--live); letter-spacing: 0.3px;
}
.reconnect-bar.show { display: flex; }
.reconnect-spinner {
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid rgba(167,139,250,0.25);
  border-top-color: var(--live);
  animation: spin 0.8s linear infinite; flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Message list */
.msg-list {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 14px 12px 8px;
  display: flex; flex-direction: column; gap: 10px;
  -webkit-overflow-scrolling: touch; scroll-behavior: smooth;
}
.msg-list::-webkit-scrollbar { width: 3px; }
.msg-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Messages */
.msg {
  display: flex; flex-direction: column;
  animation: msgIn 0.25s cubic-bezier(0.34,1.4,0.64,1) both;
  max-width: 100%;
}
.msg.sent { align-items: flex-end; }
.msg.recv { align-items: flex-start; }

.msg-bubble {
  max-width: 85%; border-radius: 14px; overflow: hidden; position: relative;
}
.msg.sent .msg-bubble { border-radius: 14px 14px 4px 14px; background: var(--sent-bg); border: 1px solid rgba(167,139,250,0.2); }
.msg.recv .msg-bubble { border-radius: 14px 14px 14px 4px; background: var(--recv-bg); border: 1px solid var(--border); }

.msg-text-container { position: relative; overflow: hidden; }
.msg-text-container.collapsed { max-height: 120px; }
.msg-text-container.expanded  { max-height: 360px; overflow-y: auto; }
.msg-text-container.collapsed::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 36px;
  pointer-events: none;
}
.msg.sent .msg-text-container.collapsed::after { background: linear-gradient(transparent, rgba(167,139,250,0.1)); }
.msg.recv .msg-text-container.collapsed::after { background: linear-gradient(transparent, rgba(255,255,255,0.04)); }

.msg-text {
  padding: 11px 14px; font-size: 0.875rem; line-height: 1.7;
  white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere;
  color: var(--text);
}

.msg-expand-btn {
  display: block; width: 100%; padding: 6px 14px; text-align: center;
  font-size: 0.65rem; letter-spacing: 1px; color: var(--live);
  cursor: pointer; background: transparent; border: none;
  border-top: 1px solid rgba(167,139,250,0.15);
  font-family: var(--mono); transition: background 0.2s;
}
.msg-expand-btn:hover { background: rgba(167,139,250,0.08); }

.msg-actions {
  display: flex; align-items: center; gap: 6px; padding: 4px 10px 8px;
}
.msg-meta { font-size: 0.62rem; color: var(--muted); }
.msg-act-btn {
  padding: 3px 9px; border-radius: 6px; font-family: var(--mono);
  font-size: 0.65rem; cursor: pointer; border: 1px solid var(--border);
  background: transparent; color: var(--text2); transition: all 0.15s;
  -webkit-tap-highlight-color: transparent; display: inline-flex; align-items: center; gap: 4px;
}
.msg-act-btn:hover, .msg-act-btn:active { border-color: var(--live); color: var(--live); }
.msg.sent .msg-actions { flex-direction: row-reverse; }

@keyframes msgIn {
  from { opacity: 0; transform: translateY(10px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* Date divider */
.time-divider {
  text-align: center; font-size: 0.62rem; color: var(--muted);
  padding: 4px 0; letter-spacing: 1px; flex-shrink: 0;
}

/* Empty state */
.beam-empty {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 32px 24px; color: var(--muted); gap: 10px;
}
.beam-empty-icon { color: var(--live); opacity: 0.6; }
.beam-empty-title { font-family: var(--sans); font-size: 1.1rem; font-weight: 700; color: var(--text2); }
.beam-empty-sub   { font-size: 0.75rem; line-height: 1.7; max-width: 240px; }

/* File message bubble */
.msg-file {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
}
.msg-file-icon {
  width: 36px; height: 36px; border-radius: 9px; flex-shrink: 0;
  background: var(--live-dim); display: flex; align-items: center; justify-content: center;
  color: var(--live);
}
.msg-file-info { flex: 1; min-width: 0; }
.msg-file-name { font-size: 0.82rem; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msg-file-meta { font-size: 0.65rem; color: var(--muted); margin-top: 2px; }
.msg-file-dl {
  flex-shrink: 0; padding: 6px 12px; border-radius: 8px; font-family: var(--mono);
  font-size: 0.65rem; cursor: pointer; border: 1px solid rgba(167,139,250,0.3);
  background: var(--live-dim); color: var(--live); transition: all 0.15s;
  display: inline-flex; align-items: center; gap: 5px;
  -webkit-tap-highlight-color: transparent;
}
.msg-file-dl:hover { background: rgba(167,139,250,0.2); }

/* File progress bar */
.file-progress {
  height: 2px; background: var(--border2); border-radius: 1px; margin: 0 14px 10px; overflow: hidden;
}
.file-progress-bar {
  height: 100%; background: var(--live); border-radius: 1px;
  width: 0%; transition: width 0.1s linear;
}
.compose-bar {
  flex-shrink: 0; padding: 10px 12px;
  padding-bottom: calc(10px + var(--safe-bottom));
  border-top: 1px solid var(--border);
  background: rgba(10,10,15,0.95);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}
.compose-inner { display: flex; gap: 8px; align-items: flex-end; }
.compose-textarea {
  flex: 1; background: var(--surface); border: 1px solid var(--border2);
  border-radius: 12px; padding: 11px 14px;
  font-family: var(--mono); font-size: 0.88rem; color: var(--text);
  resize: none; outline: none; line-height: 1.6;
  max-height: 140px; min-height: 44px;
  transition: border-color 0.2s; -webkit-appearance: none;
}
.compose-textarea:focus { border-color: var(--live); }
.compose-textarea::placeholder { color: var(--muted); }
.compose-send-btn {
  width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
  background: var(--live); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.18s; -webkit-tap-highlight-color: transparent;
  align-self: flex-end;
}
.compose-send-btn:hover  { background: #c4b5fd; transform: scale(1.04); }
.compose-send-btn:active { transform: scale(0.96); }
.compose-send-btn:disabled { background: var(--muted); opacity: 0.5; cursor: not-allowed; transform: none; }
.compose-send-btn svg { transition: transform 0.15s; }
.compose-send-btn:not(:disabled):active svg { transform: scale(0.85) rotate(-10deg); }

.compose-toolbar {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 2px 0; flex-wrap: wrap;
}
.compose-count { font-size: 0.65rem; color: var(--muted); }
.compose-count.warn   { color: var(--warn); }
.compose-count.danger { color: var(--danger); }
.compose-tool-btn {
  padding: 4px 10px; border-radius: 6px; font-family: var(--mono);
  font-size: 0.65rem; cursor: pointer; border: 1px solid var(--border);
  background: transparent; color: var(--muted); transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
  display: inline-flex; align-items: center; gap: 5px;
}
.compose-tool-btn:hover, .compose-tool-btn:active { border-color: var(--live); color: var(--live); }
.compose-tool-btn svg { flex-shrink: 0; }

/* ── BUTTONS ── */
.btn {
  padding: 11px 18px; border: none; border-radius: 10px;
  font-family: var(--mono); font-size: 0.78rem; font-weight: 700;
  cursor: pointer; transition: all 0.18s; letter-spacing: 0.3px;
  display: inline-flex; align-items: center; gap: 7px;
  white-space: nowrap; -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.btn-live  { background: var(--live); color: #000; }
.btn-live:hover  { background: #c4b5fd; transform: translateY(-1px); box-shadow: 0 6px 20px var(--live-glow); }
.btn-live:active { transform: scale(0.97); }
.btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border2); }
.btn-ghost:hover  { border-color: var(--live); color: var(--live); }
.btn-ghost:active { transform: scale(0.97); }
.btn-sm   { padding: 9px 14px; font-size: 0.72rem; }
.btn-full { width: 100%; justify-content: center; }

/* ── TOAST ── */
.toast {
  position: fixed; left: 50%;
  transform: translateX(-50%) translateY(80px);
  bottom: calc(20px + var(--safe-bottom));
  background: var(--success); color: #000;
  padding: 10px 22px; border-radius: 100px;
  font-size: 0.78rem; font-weight: 700;
  z-index: 9999; transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
  pointer-events: none; white-space: nowrap; max-width: 90vw;
  overflow: hidden; text-overflow: ellipsis;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.err  { background: var(--danger); color: #fff; }
.toast.live-t { background: var(--live); color: #000; }
.toast.warn-t { background: var(--warn); color: #000; }

/* ── DRAG OVERLAY ── */
.drag-overlay {
  position: fixed; inset: 0; z-index: 9998;
  background: rgba(167,139,250,0.06); border: 3px dashed var(--live);
  display: none; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; font-family: var(--sans); color: var(--live);
  backdrop-filter: blur(8px); font-weight: 800; text-align: center; padding: 24px;
}
.drag-overlay.show { display: flex; }
.drag-overlay-label { font-size: 1.2rem; letter-spacing: 0.5px; }

/* ── HISTORY DRAWER ── */
.history-overlay {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
  display: none; align-items: flex-end;
}
.history-overlay.show { display: flex; animation: fadeOverlay 0.2s ease; }
@keyframes fadeOverlay { from { opacity: 0; } to { opacity: 1; } }

.history-drawer {
  width: 100%; background: var(--surface); border-radius: 20px 20px 0 0;
  border: 1px solid var(--border); border-bottom: none;
  max-height: 80vh; display: flex; flex-direction: column;
  animation: drawerUp 0.3s cubic-bezier(0.34,1.2,0.64,1) both;
}
@keyframes drawerUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.drawer-handle { width: 40px; height: 4px; border-radius: 2px; background: var(--border2); margin: 12px auto 0; flex-shrink: 0; }
.drawer-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.drawer-title    { font-family: var(--sans); font-size: 1rem; font-weight: 700; }
.drawer-subtitle { font-size: 0.65rem; color: var(--muted); margin-top: 2px; }
.drawer-list { overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }

.hist-item { border-bottom: 1px solid var(--border); padding: 14px 18px; display: flex; flex-direction: column; gap: 8px; }
.hist-item:last-child { border-bottom: none; }
.hist-item-header { display: flex; align-items: center; gap: 8px; }
.hist-badge {
  font-size: 0.58rem; padding: 2px 7px; border-radius: 100px; letter-spacing: 1px; text-transform: uppercase;
}
.hist-badge.sent { background: var(--live-dim); color: var(--live); }
.hist-badge.recv { background: rgba(255,255,255,0.06); color: var(--text2); }
.hist-time  { font-size: 0.62rem; color: var(--muted); }
.hist-chars { font-size: 0.62rem; color: var(--muted); margin-left: auto; }
.hist-preview {
  font-size: 0.8rem; color: var(--text2); line-height: 1.55;
  white-space: pre-wrap; word-break: break-word;
  max-height: 72px; overflow: hidden; position: relative;
}
.hist-preview::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 28px;
  background: linear-gradient(transparent, var(--surface));
}
.hist-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.hist-act {
  padding: 6px 12px; border-radius: 8px; font-family: var(--mono); font-size: 0.68rem;
  cursor: pointer; border: 1px solid var(--border); background: transparent;
  color: var(--text2); transition: all 0.15s; touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.hist-act:hover, .hist-act:active { border-color: var(--live); color: var(--live); }
.hist-act.danger { color: var(--danger) !important; }
.hist-act.danger:hover { border-color: var(--danger) !important; }
.hist-empty { padding: 40px 24px; text-align: center; font-size: 0.78rem; color: var(--muted); }

@keyframes slideUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulse   { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }

/* ── SMALL SCREEN SAFETY ── */
@media (max-width: 360px) {
  .connect-screen { padding: 14px 12px calc(14px + var(--safe-bottom)); gap: 12px; }
  .card-body { padding: 12px; }
  .my-code-display { font-size: clamp(1.6rem, 13vw, 2.2rem); letter-spacing: clamp(2px, 1.5vw, 6px); }
  .code-text-input { font-size: clamp(1rem, 6vw, 1.3rem); letter-spacing: 3px; padding: 12px 8px; }
  .btn { padding: 10px 14px; font-size: 0.72rem; }
  .app-header { padding: 8px 12px; padding-top: calc(8px + var(--safe-top)); gap: 8px; }
  .logo { width: 30px; height: 30px; }
  .compose-bar { padding: 8px 10px; padding-bottom: calc(8px + var(--safe-bottom)); }
  .compose-tool-btn { padding: 4px 8px; font-size: 0.6rem; }
  .msg-list { padding: 10px 8px 6px; }
  .msg-bubble { max-width: 92%; }
  .hist-item { padding: 12px 14px; }
}
</style>
</head>
<body>

  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

<div id="app">

            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

          </svg>

          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>

            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>

<div class="toast" id="toast"></div>

<script>
'use strict';

/* ════════════════════════════════
   HISTORY  (localStorage, 24h TTL)
════════════════════════════════ */
const HIST_KEY = 'tb_hist_v3', MAX_HIST = 20, HIST_TTL = 864e5;
const hMap = {};

function histLoad() {
  try {
    const r = JSON.parse(localStorage.getItem(HIST_KEY) || '[]');
    return Array.isArray(r) ? r.filter(i => i && Date.now() - i.ts < HIST_TTL) : [];
  } catch(e) { return []; }
}
function histSave(arr) {
  try { localStorage.setItem(HIST_KEY, JSON.stringify(arr.slice(0, MAX_HIST))); } catch(e) {}
}
function histAdd(text, dir) {
  const items = histLoad();
  if (items[0] && items[0].text === text && Date.now() - items[0].ts < 4000) return items[0].id;
  const id = 'h' + Date.now() + Math.random().toString(36).slice(2,5);
  histSave([{ id, text, ts: Date.now(), dir: dir || 'recv' }, ...items]);
  hMap[id] = text;
  return id;
}
function histDeleteItem(id) {
  histSave(histLoad().filter(i => i.id !== id));
  delete hMap[id];
  renderHistory();
}
function clearAllHistory() {
  if (!confirm('Delete all history?')) return;
  try { localStorage.removeItem(HIST_KEY); } catch(e) {}
  Object.keys(hMap).forEach(k => delete hMap[k]);
  renderHistory();
  toast('History cleared');
}
function renderHistory() {
  const items = histLoad();
  const list = document.getElementById('hist-list');
  const lbl  = document.getElementById('hist-count-lbl');
  lbl.textContent = items.length ? `(${items.length})` : '';
  items.forEach(i => { hMap[i.id] = i.text; });
  if (!items.length) {
    list.innerHTML = '<div class="hist-empty">No history yet. Received texts will appear here.</div>';
    return;
  }
  list.innerHTML = items.map(item => {
    const isSent = item.dir === 'sent';
    const age = formatAge(Date.now() - item.ts);
    return `
      <div class="hist-item">
        <div class="hist-item-header">
          <span class="hist-badge ${isSent ? 'sent' : 'recv'}">${isSent ? '&#x2191; Sent' : '&#x2193; Recv'}</span>
          <span class="hist-time">${age}</span>
          <span class="hist-chars">${item.text.length.toLocaleString()} chars</span>
        </div>
        <div class="hist-preview">${escHtml(item.text)}</div>
        <div class="hist-actions">
          <button class="hist-act" onclick="doClipboard(hMap['${esc(item.id)}'],'Copied!')">Copy</button>
          <button class="hist-act" onclick="loadIntoCompose('${esc(item.id)}')">&#x2191; Load</button>
          <button class="hist-act" onclick="downloadText(hMap['${esc(item.id)}'],'textbeam.txt')">&#x2193; Save</button>
          <button class="hist-act danger" onclick="histDeleteItem('${esc(item.id)}')">&#x2715;</button>
        </div>
      </div>`;
  }).join('');
}
function openHistory()  { renderHistory(); document.getElementById('hist-overlay').classList.add('show'); }
function closeHistory() { document.getElementById('hist-overlay').classList.remove('show'); }
function loadIntoCompose(id) {
  const text = hMap[id];
  if (!text) return;
  document.getElementById('compose-textarea').value = text;
  onComposeInput();
  closeHistory();
  toast('Loaded into compose');
}

let lastReceivedText = '';

/* ════════════════════════════════
   JOIN CODE PERSISTENCE
════════════════════════════════ */
const JOIN_CODE_KEY = 'tb_last_join_v1';

function saveJoinCode(code) {
  try { localStorage.setItem(JOIN_CODE_KEY, code); } catch(e) {}
}
function loadJoinCode() {
  try { return localStorage.getItem(JOIN_CODE_KEY) || ''; } catch(e) { return ''; }
}
function clearJoinCode() {
  try { localStorage.removeItem(JOIN_CODE_KEY); } catch(e) {}
  const inp = document.getElementById('join-input');
  inp.value = '';
  document.getElementById('join-clear-btn').classList.remove('show');
  inp.focus();
}
function onJoinInput(inp) {
  inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  const hasVal = inp.value.length > 0;
  document.getElementById('join-clear-btn').classList.toggle('show', hasVal);
  if (hasVal) saveJoinCode(inp.value);
  else try { localStorage.removeItem(JOIN_CODE_KEY); } catch(e) {}
}

/* ════════════════════════════════
   SESSION PERSISTENCE
════════════════════════════════ */
const SESSION_KEY = 'tb_session_v1';
const SESSION_TTL = 30 * 60 * 1000; // 30 minutes

function saveSession(sessionRole, code) {
  try { localStorage.setItem(SESSION_KEY, JSON.stringify({ role: sessionRole, code, ts: Date.now() })); } catch(e) {}
}
function loadSession() {
  try {
    const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    if (!s || Date.now() - s.ts > SESSION_TTL) { clearSession(); return null; }
    return s;
  } catch(e) { return null; }
}
function clearSession() {
  try { localStorage.removeItem(SESSION_KEY); } catch(e) {}
}

/* ════════════════════════════════
   P2P — PeerJS
════════════════════════════════ */
const PEER_PFX = 'tbv4-';
let peer = null, conn = null, myCode = null, role = 'idle';

// Reconnect state
let intentionalDisconnect = false;
let reconnectAttempts = 0;
let reconnectTimer = null;
let activeJoinCode = null; // code we're currently joined to (for reconnect)
const MAX_RECONNECT = 6;
const RECONNECT_DELAYS = [2000, 3000, 5000, 8000, 13000, 21000]; // progressive back-off

function genCode() {
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  return Array.from({ length: 6 }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
}
function loadMyCode() { try { return localStorage.getItem('tb_code_v4') || null; } catch(e) { return null; } }
function saveMyCode(c) { try { localStorage.setItem('tb_code_v4', c); } catch(e) {} }
function displayCode(code) {
  document.getElementById('my-code-display').textContent = code.slice(0,3) + '\u2009' + code.slice(3);
}

function newCode() {
  if (role === 'hosting' || role === 'connected') {
    if (!confirm('Generate a new code? This will disconnect the current session.')) return;
    liveDisconnect(true);
  }
  myCode = genCode(); saveMyCode(myCode); displayCode(myCode);
  toast('New code generated');
}
function copyCode() {
  if (myCode) doClipboard(myCode, 'Code copied!');
}

/* ── HOSTING ── */
function startHosting() {
  if (!window.Peer) { showError('PeerJS failed to load. Check your internet connection and refresh.'); return; }
  if (peer) { peer.destroy(); peer = null; conn = null; }
  intentionalDisconnect = false;

  const btn = document.getElementById('host-btn');
  btn.disabled = true; btn.textContent = 'Hosting…';
  setStatus('waiting', 'Waiting…');
  hideError();

  const peerId = PEER_PFX + myCode.toLowerCase();
  try { peer = new Peer(peerId); } catch(e) { showError('Could not start: ' + e.message); resetHostBtn(); return; }

  peer.on('open', () => {
    role = 'hosting';
    setStatus('waiting', 'Waiting…');
  });

  peer.on('connection', incoming => {
    if (conn) conn.close();
    conn = incoming;
    role = 'connected';
    setupConn(conn, 'host');
  });

  peer.on('error', err => {
    if (err.type === 'unavailable-id') {
      myCode = genCode(); saveMyCode(myCode); displayCode(myCode);
      showError('That code was taken — a new one was generated. Try hosting again.');
    } else if (err.type === 'network' || err.type === 'server-error') {
      showError('Cannot reach the signaling server. Check your internet connection.');
    } else {
      showError('Error (' + err.type + '): ' + (err.message || 'Unknown'));
    }
    resetHostBtn(); role = 'idle'; setStatus('idle', 'Offline');
  });

  // Auto-reconnect to signaling server if we drop from it (keeps hosting alive)
  peer.on('disconnected', () => {
    if (peer && !peer.destroyed && !intentionalDisconnect) peer.reconnect();
  });
}

/* ── JOINING ── */
function joinRoom() {
  const raw = document.getElementById('join-input').value.trim().replace(/\s/g,'').toUpperCase();
  if (raw.length < 4) { toast('Enter a valid room code', true); return; }
  doJoin(raw, false);
}

function doJoin(raw, isReconnect) {
  if (!window.Peer) { showError('PeerJS failed to load. Check your connection and refresh.'); return; }
  if (peer) { peer.destroy(); peer = null; conn = null; }
  intentionalDisconnect = false;

  if (!isReconnect) {
    reconnectAttempts = 0;
    activeJoinCode = raw;
  }

  const btn = document.getElementById('join-btn');
  if (btn) { btn.disabled = true; }

  if (!isReconnect) {
    setStatus('waiting', 'Connecting…');
    hideError();
    role = 'joining';
  } else {
    showReconnectBar('Reconnecting… (' + reconnectAttempts + '/' + MAX_RECONNECT + ')');
  }

  try { peer = new Peer(); } catch(e) {
    if (isReconnect) scheduleReconnect(raw);
    else { showError('Could not connect: ' + e.message); resetJoinBtn(); }
    return;
  }

  peer.on('open', () => {
    const c = peer.connect(PEER_PFX + raw.toLowerCase(), { reliable: true, serialization: 'json' });
    conn = c;
    setupConn(c, 'joiner');

    const timeout = setTimeout(() => {
      if (role === 'joining') {
        if (isReconnect) {
          scheduleReconnect(raw);
        } else {
          showError('Room "' + raw + '" not found or timed out. Check the code and make sure the host is active.');
          peer.destroy(); peer = null; conn = null; role = 'idle';
          resetJoinBtn(); setStatus('idle', 'Offline');
        }
      }
    }, 14000);
    c.on('open', () => clearTimeout(timeout));
  });

  peer.on('error', err => {
    if (isReconnect) {
      scheduleReconnect(raw);
    } else {
      if (err.type === 'peer-unavailable') showError('Room "' + raw + '" not found. Check the code and make sure the host is running.');
      else if (err.type === 'network' || err.type === 'server-error') showError('Cannot reach the server. Check your internet connection.');
      else showError('Could not connect: ' + (err.message || err.type));
      role = 'idle'; resetJoinBtn(); setStatus('idle', 'Offline');
    }
  });
}

function scheduleReconnect(code) {
  if (intentionalDisconnect) return;
  if (reconnectAttempts >= MAX_RECONNECT) {
    hideReconnectBar();
    setStatus('idle', 'Offline');
    showConnectScreen();
    toast('Could not reconnect. Host may be offline.', true);
    clearSession();
    resetJoinBtn();
    return;
  }
  const delay = RECONNECT_DELAYS[Math.min(reconnectAttempts, RECONNECT_DELAYS.length - 1)];
  reconnectAttempts++;
  showReconnectBar('Reconnecting in ' + Math.round(delay/1000) + 's… (' + reconnectAttempts + '/' + MAX_RECONNECT + ')');
  clearTimeout(reconnectTimer);
  reconnectTimer = setTimeout(() => {
    if (!intentionalDisconnect) doJoin(code, true);
  }, delay);
}

/* ── CONNECTION SETUP ── */
function setupConn(c, myRole) {
  c.on('open', () => {
    role = 'connected';
    reconnectAttempts = 0;
    clearTimeout(reconnectTimer);
    hideReconnectBar();
    setStatus('connected', 'Connected');
    showBeamScreen();
    toast('Connected!', 'live');
    resetHostBtn(); resetJoinBtn();
    // Persist session
    if (myRole === 'joiner') saveSession('joining', activeJoinCode);
    else saveSession('hosting', myCode);
  });

  c.on('data', data => {
    if (!data) return;
    if (data.type === 'text') {
      appendMsg(data.text, 'recv', data.ts || Date.now());
      histAdd(data.text, 'recv');
      lastReceivedText = data.text;
      document.getElementById('save-btn').style.display = 'inline-flex';
      toast('Text received!', 'live');
    } else if (data.type === 'file-start' || data.type === 'file-chunk' || data.type === 'file-end') {
      receiveFileChunk(data);
    }
  });

  c.on('close', () => {
    conn = null;
    if (myRole === 'host') {
      role = 'hosting';
      setStatus('waiting', 'Waiting…');
    } else {
      // Joiner: attempt auto-reconnect
      if (!intentionalDisconnect && activeJoinCode) {
        role = 'joining';
        setStatus('reconnecting', 'Reconnecting…');
        showReconnectBar('Connection lost. Reconnecting…');
        scheduleReconnect(activeJoinCode);
      } else {
        role = 'idle'; setStatus('idle', 'Offline'); showConnectScreen();
      }
    }
    if (intentionalDisconnect) toast('Disconnected');
    else toast('Connection lost', true);
  });

  c.on('error', e => {
    setStatus('idle', 'Error');
    toast('Connection error: ' + e.message, true);
  });
}

/* ── SEND ── */
function beamText() {
  const text = document.getElementById('compose-textarea').value;
  if (!text.trim()) return;
  if (!conn || !conn.open) { toast('Not connected', true); return; }
  try {
    conn.send({ type: 'text', text, ts: Date.now() });
    appendMsg(text, 'sent', Date.now());
    histAdd(text, 'sent');
    document.getElementById('compose-textarea').value = '';
    onComposeInput();
    toast('Beamed!', 'live');
  } catch(e) { toast('Send failed: ' + e.message, true); }
}

/* ── FILE SEND/RECEIVE — chunked protocol ── */
// WebRTC data channels have a ~16KB per-message limit across all browsers.
// We chunk every file into 14KB pieces, send them numbered, and reassemble.

const FILE_SIZE_LIMIT = 100 * 1024 * 1024; // 100 MB
const CHUNK_SIZE      = 14 * 1024;          // 14 KB per chunk (safe under 16 KB limit)
const CHUNK_DELAY_MS  = 8;                  // ms gap between chunks — prevents buffer overflow

// Incoming file assembly map: fileId → { meta, chunks[] }
const inboundFiles = {};

function triggerFilePick() {
  if (!conn || !conn.open) { toast('Connect first before sending a file', true); return; }
  const picker = document.getElementById('file-picker');
  picker.value = '';
  picker.click();
}

function sendFile(file) {
  if (!file) return;
  if (!conn || !conn.open) { toast('Not connected', true); return; }
  if (file.size > FILE_SIZE_LIMIT) {
    toast('File too large — max 100 MB', true); return;
  }

  const fileBtn = document.getElementById('file-btn');
  fileBtn.disabled = true;

  const msgId  = appendFileMsg(file.name, file.size, file.type, 'sent', null);
  const fileId = 'f' + Date.now();
  const mime   = file.type || 'application/octet-stream';

  const reader = new FileReader();
  reader.onload = ev => {
    const buffer     = ev.target.result;          // ArrayBuffer — no deprecated API
    const totalBytes = buffer.byteLength;
    const totalChunks = Math.ceil(totalBytes / CHUNK_SIZE) || 1;

    // 1. Send metadata header
    try {
      conn.send({ type: 'file-start', fileId, name: file.name, size: totalBytes, mime, totalChunks, ts: Date.now() });
    } catch(e) {
      toast('File send failed: ' + e.message, true);
      fileBtn.disabled = false;
      return;
    }

    // 2. Send chunks with small delay between each to avoid flooding the buffer
    let chunkIndex = 0;

    function sendNextChunk() {
      if (!conn || !conn.open) {
        toast('Connection lost during file send', true);
        fileBtn.disabled = false;
        return;
      }
      if (chunkIndex >= totalChunks) {
        // 3. Send EOF marker
        try {
          conn.send({ type: 'file-end', fileId });
        } catch(e) { /* ignored — receiver will use totalChunks to know it's done */ }
        updateFileProgress(msgId, 100);
        setTimeout(() => removeFileProgress(msgId), 700);
        // Mark sender bubble as sent
        const dlPlaceholder = document.querySelector('#' + msgId + ' .msg-file-dl');
        if (dlPlaceholder) {
          dlPlaceholder.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Sent`;
          dlPlaceholder.style.opacity = '0.7';
        }
        toast('File beamed!', 'live');
        fileBtn.disabled = false;
        return;
      }

      const start  = chunkIndex * CHUNK_SIZE;
      const end    = Math.min(start + CHUNK_SIZE, totalBytes);
      const slice  = buffer.slice(start, end);

      // Convert ArrayBuffer chunk → base64 safely (no readAsBinaryString)
      const uint8  = new Uint8Array(slice);
      let binary   = '';
      for (let i = 0; i < uint8.length; i++) binary += String.fromCharCode(uint8[i]);
      const b64    = btoa(binary);

      try {
        conn.send({ type: 'file-chunk', fileId, index: chunkIndex, data: b64 });
      } catch(e) {
        toast('File send failed at chunk ' + chunkIndex + ': ' + e.message, true);
        fileBtn.disabled = false;
        return;
      }

      const progress = ((chunkIndex + 1) / totalChunks) * 100;
      updateFileProgress(msgId, progress);
      chunkIndex++;

      // Schedule next chunk with a tiny delay to let the data channel drain
      setTimeout(sendNextChunk, CHUNK_DELAY_MS);
    }

    sendNextChunk();
  };

  reader.onerror = () => {
    toast('Could not read file', true);
    fileBtn.disabled = false;
  };

  reader.readAsArrayBuffer(file); // Modern, reliable, works everywhere
}

/* ── RECEIVE ── called by setupConn data handler ── */
function receiveFileChunk(data) {
  const { type, fileId } = data;

  if (type === 'file-start') {
    inboundFiles[fileId] = {
      name: data.name,
      size: data.size,
      mime: data.mime,
      totalChunks: data.totalChunks,
      chunks: [],
      msgId: appendFileMsg(data.name, data.size, data.mime, 'recv', null)
    };
    updateFileProgress(inboundFiles[fileId].msgId, 0);
    return;
  }

  if (type === 'file-chunk') {
    const f = inboundFiles[fileId];
    if (!f) return;
    f.chunks[data.index] = data.data; // store base64 chunk by index (sparse array)
    const received = Object.keys(f.chunks).length;
    updateFileProgress(f.msgId, (received / f.totalChunks) * 95);
    return;
  }

  if (type === 'file-end') {
    const f = inboundFiles[fileId];
    if (!f) return;

    try {
      // Reassemble: decode each base64 chunk and concatenate into one Uint8Array
      const totalBytes  = f.chunks.reduce((acc, b64) => acc + atob(b64).length, 0);
      const assembled   = new Uint8Array(totalBytes);
      let offset        = 0;
      for (const b64 of f.chunks) {
        const bin = atob(b64);
        for (let i = 0; i < bin.length; i++) assembled[offset++] = bin.charCodeAt(i);
      }

      const blob = new Blob([assembled], { type: f.mime || 'application/octet-stream' });
      const url  = URL.createObjectURL(blob);

      // Update the "Sending…" button to a real Save link
      activateFileDownload(f.msgId, f.name, url);
      updateFileProgress(f.msgId, 100);
      setTimeout(() => removeFileProgress(f.msgId), 700);
      toast('File received!', 'live');
    } catch(e) {
      toast('File assembly failed: ' + e.message, true);
    }

    delete inboundFiles[fileId];
  }
}

/* Swap the "Sending…" placeholder with a real download anchor */
function activateFileDownload(msgId, name, url) {
  const bubble = document.querySelector('#' + msgId + ' .msg-file-dl');
  if (!bubble) return;
  const a = document.createElement('a');
  a.className   = 'msg-file-dl';
  a.href        = url;
  a.download    = name;
  a.innerHTML   = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Save`;
  bubble.replaceWith(a);
}

function appendFileMsg(name, size, mime, dir, downloadUrl) {
  const list  = document.getElementById('msg-list');
  const empty = document.getElementById('beam-empty');
  if (empty) empty.remove();

  const id      = 'msg' + (++msgCount);
  const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const isSent  = dir === 'sent';
  const sizeStr = size < 1024 ? size + ' B' : size < 1048576 ? (size/1024).toFixed(1) + ' KB' : (size/1048576).toFixed(2) + ' MB';

  // Pick icon by mime
  let iconPath = `<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>`;
  if (mime && mime.startsWith('image/')) iconPath = `<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>`;
  else if (mime && mime.startsWith('audio/')) iconPath = `<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>`;
  else if (mime && mime.startsWith('video/')) iconPath = `<polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/>`;

  const dlBtn = downloadUrl
    ? `<a class="msg-file-dl" href="${downloadUrl}" download="${escHtml(name)}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Save</a>`
    : `<span class="msg-file-dl" style="opacity:0.4;cursor:default"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="2" x2="12" y2="16"/><polyline points="8 12 12 16 16 12"/></svg> Sending…</span>`;

  const div = document.createElement('div');
  div.className = 'msg ' + (isSent ? 'sent' : 'recv');
  div.id = id;
  div.innerHTML = `
    <div class="msg-bubble">
      <div class="msg-file">
        <div class="msg-file-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${iconPath}</svg>
        </div>
        <div class="msg-file-info">
          <div class="msg-file-name" title="${escHtml(name)}">${escHtml(name)}</div>
          <div class="msg-file-meta">${sizeStr}</div>
        </div>
        ${dlBtn}
      </div>
      <div class="file-progress" id="fp-${id}"><div class="file-progress-bar" id="fpb-${id}"></div></div>
      <div class="msg-actions">
        <span class="msg-meta">${timeStr}</span>
      </div>
    </div>`;

  list.appendChild(div);
  requestAnimationFrame(() => list.scrollTop = list.scrollHeight);
  return id;
}

function updateFileProgress(id, pct) {
  const bar = document.getElementById('fpb-' + id);
  if (bar) bar.style.width = pct + '%';
}
function removeFileProgress(id) {
  const fp = document.getElementById('fp-' + id);
  if (fp) fp.style.display = 'none';
}

/* ════════════════════════════════
   UI — MESSAGES
════════════════════════════════ */
let msgCount = 0;

function appendMsg(text, dir, ts) {
  const list  = document.getElementById('msg-list');
  const empty = document.getElementById('beam-empty');
  if (empty) empty.remove();

  const id      = 'msg' + (++msgCount);
  const timeStr = new Date(ts || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const isSent  = dir === 'sent';
  const isLong  = text.length > 300 || (text.match(/\n/g) || []).length > 6;

  const div = document.createElement('div');
  div.className = 'msg ' + (isSent ? 'sent' : 'recv');
  div.id = id;

  const copyIcon    = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
  const saveIcon    = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;
  const editIcon    = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;

  div.innerHTML = `
    <div class="msg-bubble">
      <div class="msg-text-container${isLong ? ' collapsed' : ''}" id="tc-${id}">
        <div class="msg-text">${escHtml(text)}</div>
      </div>
      ${isLong ? `<button class="msg-expand-btn" id="eb-${id}" onclick="toggleMsgExpand('${id}')">Show more &#x2193;</button>` : ''}
      <div class="msg-actions">
        <span class="msg-meta">${timeStr} · ${text.length.toLocaleString()} chars</span>
        <button class="msg-act-btn" onclick="doClipboard(getMsgText('${id}'),'Copied!')">${copyIcon} Copy</button>
        <button class="msg-act-btn" onclick="downloadText(getMsgText('${id}'),'textbeam-${isSent?'sent':'received'}.txt')">${saveIcon} Save</button>
        ${isSent ? '' : `<button class="msg-act-btn" onclick="loadMsgIntoCompose('${id}')">${editIcon} Edit</button>`}
      </div>
    </div>`;

  list.appendChild(div);
  requestAnimationFrame(() => list.scrollTop = list.scrollHeight);
}

function getMsgText(id) {
  const el = document.getElementById(id);
  return el ? el.querySelector('.msg-text').textContent : '';
}
function toggleMsgExpand(id) {
  const tc  = document.getElementById('tc-' + id);
  const btn = document.getElementById('eb-' + id);
  if (!tc || !btn) return;
  const col = tc.classList.contains('collapsed');
  tc.classList.toggle('collapsed', !col);
  tc.classList.toggle('expanded', col);
  btn.innerHTML = col ? 'Show less &#x2191;' : 'Show more &#x2193;';
}
function loadMsgIntoCompose(id) {
  const text = getMsgText(id);
  if (!text) return;
  document.getElementById('compose-textarea').value = text;
  onComposeInput();
  document.getElementById('compose-textarea').focus();
  toast('Loaded into compose');
}

/* ════════════════════════════════
   COMPOSE
════════════════════════════════ */
function onComposeInput() {
  const ta   = document.getElementById('compose-textarea');
  const text = ta.value;
  const len  = text.length;

  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 140) + 'px';

  const countEl = document.getElementById('compose-count');
  if (len > 0) {
    const wc = text.trim().split(/\s+/).filter(Boolean).length;
    countEl.textContent = len.toLocaleString() + ' chars · ' + wc + ' words';
    countEl.className = 'compose-count' + (len > 5000 ? ' danger' : len > 2500 ? ' warn' : '');
  } else {
    countEl.textContent = '';
  }

  document.getElementById('send-btn').disabled = !text.trim() || !conn || !conn.open;
}

function handleComposeKey(e) {
  if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 600) {
    e.preventDefault(); beamText();
  }
}
function clearCompose() {
  document.getElementById('compose-textarea').value = '';
  onComposeInput();
}
async function pasteFromClipboard() {
  if (!navigator.clipboard?.readText) { toast('Paste manually into the text field', true); return; }
  try {
    const text = await navigator.clipboard.readText();
    if (!text.trim()) { toast('Clipboard is empty', true); return; }
    document.getElementById('compose-textarea').value = text;
    onComposeInput();
    toast('Pasted!');
  } catch(e) { toast('Clipboard permission denied — paste manually', true); }
}
function downloadLastReceived() {
  if (lastReceivedText) downloadText(lastReceivedText, 'textbeam-received.txt');
}

   ERROR
════════════════════════════════ */
function showError(msg) {
  const el = document.getElementById('error-card');
  el.textContent = msg; el.classList.add('show');
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function hideError() { document.getElementById('error-card').classList.remove('show'); }

/* ════════════════════════════════
   UTILITIES
════════════════════════════════ */
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  const cls = type === 'live' ? ' live-t' : type === true ? ' err' : type === 'warn' ? ' warn-t' : '';
  el.className = 'toast' + cls;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2600);
}
function doClipboard(text, msg) {
  if (!text) return;
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(text).then(() => toast(msg)).catch(() => { legacyCopy(text); toast(msg); });
  } else { legacyCopy(text); toast(msg); }
}
function legacyCopy(text) {
  const ta = Object.assign(document.createElement('textarea'), {
    value: text, style: 'position:fixed;top:-9999px;left:-9999px;opacity:0'
  });
  document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
}
function downloadText(text, name) {
  if (!text) return;
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' })),
    download: name
  });
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Saved!');
}
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
function esc(s) { return String(s).replace(/['"\\<>]/g, ''); }
function formatAge(ms) {
  const s = Math.floor(ms/1000); if (s < 60) return 'just now';
  const m = Math.floor(s/60);   if (m < 60) return m + 'm ago';
  const h = Math.floor(m/60);   if (h < 24) return h + 'h ago';
  return Math.floor(h/24) + 'd ago';
}

/* ════════════════════════════════
   DRAG & DROP text files
════════════════════════════════ */
let dragCount = 0;
document.addEventListener('dragenter', e => {
  if ([...e.dataTransfer.types].includes('Files')) { dragCount++; document.getElementById('drag-overlay').classList.add('show'); }
});
document.addEventListener('dragleave', () => {
  if (--dragCount <= 0) { dragCount = 0; document.getElementById('drag-overlay').classList.remove('show'); }
});
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault(); dragCount = 0; document.getElementById('drag-overlay').classList.remove('show');
  const file = e.dataTransfer.files?.[0]; if (!file) return;
  const isText = file.type.startsWith('text/') || /\.(txt|md|csv|json|xml|html|css|js|ts|py|sh|log)$/i.test(file.name);
  if (isText && (!conn || !conn.open)) {
    // Load into compose for text files when not connected
    const reader = new FileReader();
    reader.onload = ev => { document.getElementById('compose-textarea').value = ev.target.result; onComposeInput(); toast('File loaded!'); };
    reader.onerror = () => toast('Could not read file', true);
    reader.readAsText(file);
  } else if (conn && conn.open) {
    // Connected: send any file directly
    sendFile(file);
  } else {
    toast('Connect first to send files, or drop a text file to load it', true);
  }
});

/* ════════════════════════════════
   KEYBOARD
════════════════════════════════ */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('hist-overlay').classList.contains('show')) closeHistory();
});

/* ════════════════════════════════
   CLEANUP
════════════════════════════════ */
window.addEventListener('beforeunload', () => {
  if (peer && !peer.destroyed) peer.destroy();
});
document.addEventListener('visibilitychange', () => {
  const btn = document.getElementById('send-btn');
  if (btn) btn.disabled = !document.getElementById('compose-textarea').value.trim() || !conn || !conn.open;
});

/* ════════════════════════════════
   INIT
════════════════════════════════ */
(function init() {
  myCode = loadMyCode();
  if (!myCode) { myCode = genCode(); saveMyCode(myCode); }
  displayCode(myCode);
  setStatus('idle', 'Offline');
  renderHistory();

  // Restore last join code
  const savedJoin = loadJoinCode();
  if (savedJoin) {
    const inp = document.getElementById('join-input');
    inp.value = savedJoin;
    document.getElementById('join-clear-btn').classList.add('show');
  }

  // Check for a saved session and offer restore
  const session = loadSession();
  if (session) showRestoreBanner(session);
})();
</script>
</body>
</html>
